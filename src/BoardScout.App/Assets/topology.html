<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
:root{--bg:#060b10;--s:#0c1620;--sr:#111e2c;--b:#162030;--t:#e8edf4;--ts:#8a9bb2;--tm:#4a6080;
  --a:#3d9eff;--ok:#10b981;--w:#f59e0b;--cr:#ef4444;--p:#a78bfa;--tl:#2dd4bf;--or:#fb923c}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t);font-family:'Segoe UI',system-ui,sans-serif;overflow:auto}
svg{display:block;width:100%;min-height:100vh}
.node rect{rx:10;ry:10;stroke-width:2;cursor:pointer;transition:filter .15s}
.node rect:hover{filter:brightness(1.25) drop-shadow(0 0 8px rgba(61,158,255,.3))}
.node text{fill:var(--t);pointer-events:none}
.node .label{font-weight:600;font-size:14px}
.node .detail{fill:var(--ts);font-size:11px}
.link{fill:none;stroke-width:2;opacity:.5}
.link:hover{opacity:1;stroke-width:3}
.badge{font-size:10px;font-family:'Segoe UI',sans-serif;pointer-events:none}
.badge rect{rx:10;ry:10}
.title-text{fill:var(--tm);font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase}
.hint{fill:var(--tm);font-size:10px}
.tooltip{position:fixed;background:var(--sr);border:1px solid var(--b);color:var(--t);padding:12px 16px;border-radius:10px;
  font-size:12px;max-width:340px;line-height:1.6;pointer-events:none;z-index:99;display:none;box-shadow:0 6px 32px rgba(0,0,0,.6)}
.tooltip h4{font-size:13px;margin-bottom:4px}
.tooltip .tip-detail{color:var(--ts);margin-top:6px;font-size:11px}
</style>
</head>
<body>
<div class="tooltip" id="tip"></div>
<svg id="topo"></svg>
<script>
const COLORS={cpu:'#3d9eff',memory:'#f59e0b',gpu:'#10b981',storage:'#10b981',chipset:'#a78bfa',
  usb:'#2dd4bf',sata:'#fb923c',open:'#4a6080',lan:'#10b981',wifi:'#10b981'};
const BG='#0c1620',STROKE='#162030';

function shortCpu(n){return(n||'CPU').replace(/ with Radeon Graphics/i,'').replace(/AMD /i,'').replace(/Intel\(R\) /i,'')}

function buildTree(scan){
  const cpu=scan.system?.cpu;
  const cpuName=shortCpu(Array.isArray(cpu)?cpu[0]?.name:cpu?.name);
  const cores=Array.isArray(cpu)?cpu[0]?.cores:cpu?.cores;
  const threads=Array.isArray(cpu)?cpu[0]?.threads:cpu?.threads;
  const mem=scan.memory||{};
  const first=mem.slots?.[0];
  const comps=scan.components||[];
  const gpu=comps.find(c=>c.category==='gpu');
  const storage=comps.filter(c=>c.category==='storage');
  const nvme=storage.filter(c=>(c.lookup_hints?.bus_type||'').toLowerCase()==='nvme');
  const sata=storage.filter(c=>(c.lookup_hints?.bus_type||'').toLowerCase()==='sata');
  const wifi=comps.find(c=>c.category==='network'&&/Wi-?Fi|Wireless|AX\d{3}/i.test(c.model));
  const lan=comps.find(c=>c.category==='network'&&c!==wifi&&/Ethernet|GbE|Realtek/i.test(c.model));
  const chipsetComp=comps.find(c=>c.category==='chipset');
  const usb=scan.usb_devices||[];
  const usbCount=usb.filter(d=>d.class!=='USB').length;
  const ff=(scan.form_factor||'').toUpperCase();

  const tree={
    id:'cpu',name:cpuName,detail:`${cores||0} cores / ${threads||0} threads`,color:COLORS.cpu,
    tip:`Processor with ${cores} cores and ${threads} threads. CPU-direct paths avoid the chipset uplink entirely.`,
    children:[]
  };

  tree.children.push({id:'mem',name:`DDR4 ${mem.populated||0}×${mem.total_bytes?Math.round(mem.total_bytes/1073741824/Math.max(1,mem.populated||1)):0} GB`,
    detail:first?`${first.speed_mhz} / ${first.rated_mhz} MT/s`:'',color:COLORS.memory,bus:'DDR4 dual ch.',
    tip:'Memory is directly attached to the CPU. Enable the rated memory profile in firmware for full speed.'});

  if(gpu){
    tree.children.push({id:'gpu',name:gpu.model.replace('NVIDIA ',''),detail:'PCIE1 · CPU-direct',color:COLORS.gpu,bus:'PCIe 3.0 x16',bw:'15.8 GB/s',
      tip:'Primary graphics slot. CPU-direct connection with maximum bandwidth.'});
  }
  if(nvme.length>0){
    tree.children.push({id:'m2-1',name:nvme[0].model,detail:'M2_1 · CPU-direct',color:COLORS.storage,bus:'PCIe 3.0 x4',bw:'3.9 GB/s',
      tip:'Fastest native storage socket. CPU-direct with no chipset contention.'});
  }

  const chipsetChildren=[];
  if(nvme.length>1){
    chipsetChildren.push({id:'m2-2',name:nvme[1].model,detail:'M2_2 · disables SATA 5/6',color:COLORS.storage,bus:'PCIe 3.0 x2',bw:'1.97 GB/s',
      tip:'Secondary M.2 slot. Limited to x2 and disables SATA ports 5-6 while occupied.'});
  }
  if(ff!=='MINI-ITX'){
    chipsetChildren.push({id:'pcie-x1',name:'PCIE2 slot',detail:'x1 · available',color:COLORS.open,bus:'PCIe 3.0 x1',dashed:true,
      tip:'Short expansion slot. Good for capture, sound, USB, or network cards.'});
    chipsetChildren.push({id:'pcie-x4',name:'PCIE3 slot',detail:'x4 in x16 · available',color:COLORS.open,bus:'PCIe 3.0 x4',dashed:true,
      tip:'Best slot for NVMe expansion adapters. Full-length physical slot, electrically x4.'});
  }
  if(wifi){
    chipsetChildren.push({id:'wifi',name:wifi.model.replace('Intel(R) ',''),detail:'M2_3 Key-E',color:COLORS.wifi,bus:'PCIe + USB',
      tip:'WiFi/BT module in Key-E socket. This cannot accept an NVMe SSD.'});
  }
  if(lan){
    chipsetChildren.push({id:'lan',name:lan.model,detail:'Onboard',color:COLORS.lan,bus:'PCIe 3.0 x1',
      tip:'Onboard Ethernet controller. Chipset-connected, does not use a user slot.'});
  }
  if(sata.length>0){
    chipsetChildren.push({id:'sata',name:`SATA (${sata.length})`,detail:`${sata.length} installed · 6 ports`,color:COLORS.sata,bus:'SATA III',bw:'600 MB/s',
      tip:`${sata.length} SATA drive(s). Ports 5-6 unavailable while M2_2 is occupied.`});
  }
  chipsetChildren.push({id:'usb',name:'USB controllers',detail:`${usbCount} devices`,color:COLORS.usb,bus:'USB 3.2/2.0',
    tip:'Chipset USB controllers with shared bandwidth between hubs.'});

  tree.children.push({
    id:'chipset',name:chipsetComp?.model?.replace(/AMD /,'')??'Chipset',detail:'Platform hub',color:COLORS.chipset,
    bus:'x4 uplink',bw:'3.9 GB/s shared',
    tip:'All devices below share the chipset-to-CPU uplink. Aggregate throughput is capped at 3.9 GB/s.',
    children:chipsetChildren
  });

  return tree;
}

function render(scan){
  const svg=d3.select('#topo');
  svg.selectAll('*').remove();
  const W=window.innerWidth;
  const nodeW=200,nodeH=56;

  const root=d3.hierarchy(buildTree(scan));
  const treeLayout=d3.tree().nodeSize([nodeW+40,140]).separation((a,b)=>a.parent===b.parent?1:1.2);
  treeLayout(root);

  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  root.each(d=>{minX=Math.min(minX,d.x);maxX=Math.max(maxX,d.x);minY=Math.min(minY,d.y);maxY=Math.max(maxY,d.y)});

  const treeW=maxX-minX+nodeW+80;
  const treeH=maxY-minY+nodeH+160;
  const topPad=60;
  const H=treeH+topPad+40;

  const scale=Math.min((W-40)/treeW,1);
  const tx=(W/2)-(((maxX+minX)/2)*scale);
  const ty=topPad-minY*scale+40;

  svg.attr('viewBox',`0 0 ${W} ${H}`).style('height',H+'px');

  const g=svg.append('g').attr('transform',`translate(${tx},${ty}) scale(${scale})`);
  const tip=document.getElementById('tip');

  g.selectAll('.link').data(root.links()).join('path')
    .attr('class','link')
    .attr('stroke',d=>d.target.data.color||'#4a6080')
    .attr('stroke-dasharray',d=>d.target.data.dashed?'6,4':null)
    .attr('d',d3.linkVertical().x(d=>d.x).y(d=>d.y));

  const badges=root.links().filter(d=>d.target.data.bus);
  g.selectAll('.badge-g').data(badges).join('g').attr('class','badge-g')
    .attr('transform',d=>{
      const mx=(d.source.x+d.target.x)/2;
      const my=(d.source.y+d.target.y)/2;
      return `translate(${mx},${my})`;
    })
    .each(function(d){
      const sel=d3.select(this);
      const text=d.target.data.bus+(d.target.data.bw?' │ '+d.target.data.bw:'');
      const tw=text.length*6+20;
      sel.append('rect').attr('x',-tw/2).attr('y',-10).attr('width',tw).attr('height',18)
        .attr('fill',BG).attr('stroke',d.target.data.color||STROKE).attr('stroke-width',.7).attr('opacity',.95);
      sel.append('text').attr('class','badge').attr('text-anchor','middle').attr('dy',3)
        .attr('fill',d.target.data.color||'#8a9bb2').text(text);
    });

  const node=g.selectAll('.node').data(root.descendants()).join('g')
    .attr('class','node')
    .attr('transform',d=>`translate(${d.x},${d.y})`);

  node.append('rect')
    .attr('x',-nodeW/2).attr('y',-nodeH/2).attr('width',nodeW).attr('height',nodeH)
    .attr('fill',BG).attr('stroke',d=>d.data.color||STROKE)
    .attr('stroke-dasharray',d=>d.data.dashed?'6,4':null)
    .on('mouseenter',(e,d)=>{
      tip.style.display='block';
      tip.innerHTML=`<h4 style="color:${d.data.color}">${d.data.name}</h4>`+(d.data.tip||'')
        +(d.data.bus?`<div class="tip-detail">${d.data.bus}${d.data.bw?' │ '+d.data.bw:''}</div>`:'');
    })
    .on('mousemove',e=>{tip.style.left=(e.clientX+16)+'px';tip.style.top=(e.clientY-10)+'px'})
    .on('mouseleave',()=>{tip.style.display='none'});

  node.append('text').attr('class','label').attr('text-anchor','middle').attr('dy',-6)
    .text(d=>{const n=d.data.name;return n.length>24?n.slice(0,22)+'…':n});
  node.append('text').attr('class','detail').attr('text-anchor','middle').attr('dy',14)
    .text(d=>d.data.detail||'');

  svg.append('text').attr('class','title-text').attr('x',24).attr('y',24).text('Bandwidth topology');
  svg.append('text').attr('class','hint').attr('x',W-24).attr('y',24).attr('text-anchor','end')
    .text('CPU-direct paths bypass the chipset uplink · hover any node');
  svg.append('text').attr('class','hint').attr('x',W/2).attr('y',H-14).attr('text-anchor','middle')
    .attr('fill','#3d9eff')
    .text('Key-E (M2_3) is the wireless slot — removing it does not create an NVMe socket');
}

if(window.chrome&&window.chrome.webview){
  window.chrome.webview.addEventListener('message',e=>{
    if(e.data) render(e.data);
  });
}
window.addEventListener('message',e=>{
  try{
    const data=typeof e.data==='string'?JSON.parse(e.data):e.data;
    if(data) render(data);
  }catch(err){console.error('topology message error',err)}
});
window.addEventListener('resize',()=>{if(window._lastScan) render(window._lastScan)});
const origRender=render;
render=function(s){window._lastScan=s;origRender(s)};
</script>
</body>
</html>
